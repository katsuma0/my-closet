<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f6f3ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Closet" />
  <title>My Closet</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="preload" href="css/fonts/cormorant-garamond-latin-500-italic.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    // appearance choices, applied before the page paints
    try {
      var p = JSON.parse(localStorage.getItem('closet.prefs') || '{}'), r = document.documentElement;
      if (p.theme === 'light' || p.theme === 'dark') r.dataset.theme = p.theme;
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.chrome) r.classList.add('native-bar');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <h1 class="title" id="view-title">My closet</h1>
      <button class="text-btn" id="select-btn" hidden>Select</button>
    </header>

    <main id="views">
      <section class="view active" id="view-closet" data-title="My closet"></section>
      <section class="view" id="view-mix" data-title="Mix"></section>
      <section class="view" id="view-outfits" data-title="Looks"></section>
      <section class="view" id="view-more" data-title="More"></section>
    </main>

    <nav class="tabbar" id="tabbar">
      <div class="tabs glass" id="tabs">
        <span class="tab-ind" id="tab-ind"></span>
        <button class="tab active" data-view="closet" aria-label="Closet">
          <svg viewBox="0 0 24 24"><path d="M12 5.5a1.8 1.8 0 1 0-1.8-1.8"/><path d="M12 5.5v1.2L3.4 13a1.2 1.2 0 0 0 .7 2.2h15.8a1.2 1.2 0 0 0 .7-2.2L12 6.7"/></svg>
          <span>Closet</span>
        </button>
        <button class="tab" data-view="mix" aria-label="Mix">
          <svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>
          <span>Mix</span>
        </button>
        <button class="tab" data-view="outfits" aria-label="Looks">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="9" rx="1"/><rect x="13.5" y="3.5" width="7" height="5" rx="1"/><rect x="13.5" y="11.5" width="7" height="9" rx="1"/><rect x="3.5" y="15.5" width="7" height="5" rx="1"/></svg>
          <span>Looks</span>
        </button>
        <button class="tab" id="more-tab" data-view="more" aria-label="More">
          <svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></svg>
          <span>More</span>
        </button>
      </div>
      <button class="fab" id="fab" aria-label="Add clothes or create a look">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </nav>
  </div>

  <div id="layer"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-camera" accept="image/*" capture="environment" hidden />
  <input type="file" id="file-library" accept="image/*" hidden />
  <input type="file" id="file-import" accept="application/json" hidden />

  <script type="module" src="js/app.js"></script>
</body>
</html>
