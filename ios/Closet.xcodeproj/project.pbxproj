			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Copies the web app from the repo root into Closet.app/web at every build.\n# The repo root is the folder above ios/, where index.html is.\nset -eu\n\nif [ \"${ENABLE_USER_SCRIPT_SANDBOXING:-NO}\" = \"YES\" ]; then\n  echo \"error: Copy web app: User Script Sandboxing is on, so this step cannot read the web files. Closet target > Build Settings > User Script Sandboxing: set it to No.\"\n  exit 1\nfi\n\nif [ -z \"${SRCROOT:-}\" ] || [ -z \"${TARGET_BUILD_DIR:-}\" ] || [ -z \"${UNLOCALIZED_RESOURCES_FOLDER_PATH:-}\" ]; then\n  echo \"error: Copy web app: run this as a build phase in Xcode, which sets SRCROOT, TARGET_BUILD_DIR and UNLOCALIZED_RESOURCES_FOLDER_PATH.\"\n  exit 1\nfi\nif ! root=$(cd \"${SRCROOT}/..\" 2>/dev/null && pwd); then\n  echo \"error: Copy web app: cannot open the folder above ${SRCROOT}.\"\n  exit 1\nfi\ndest=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/web\"\n\nif [ ! -f \"$root/index.html\" ]; then\n  echo \"error: Copy web app: $root/index.html not found. Keep the ios folder in the repo, next to index.html.\"\n  exit 1\nfi\nfor d in css js; do\n  if [ ! -d \"$root/$d\" ]; then\n    echo \"error: Copy web app: the $d folder is missing from $root.\"\n    exit 1\n  fi\ndone\n\nrm -rf \"$dest\"\nmkdir -p \"$dest\"\ncp \"$root/index.html\" \"$dest/\"\nfor f in manifest.webmanifest sw.js; do\n  if [ -f \"$root/$f\" ]; then\n    cp \"$root/$f\" \"$dest/\"\n  else\n    echo \"warning: Copy web app: no $f in $root, skipped.\"\n  fi\ndone\nfor d in css js icons; do\n  if [ -d \"$root/$d\" ]; then\n    cp -R \"$root/$d\" \"$dest/\"\n  else\n    echo \"warning: Copy web app: no $d folder in $root, skipped.\"\n  fi\ndone\n# Optional: fonts bundled with the web app.\nif [ -d \"$root/fonts\" ]; then\n  cp -R \"$root/fonts\" \"$dest/\"\nfi\n\n# Finder files and extended attributes have no place in a signed app.\nfind \"$dest\" -name .DS_Store -type f -exec rm -f {} +\nif command -v xattr >/dev/null 2>&1; then\n  xattr -cr \"$dest\" 2>/dev/null || true\nfi\necho \"Copy web app: copied the web app to $dest\"\n";
			showEnvVarsInLog = 0;
		};
/* End PBXShellScriptBuildPhase section */

